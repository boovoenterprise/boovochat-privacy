<p>Para excluir sua conta do Boovochat e todos os seus dados, envie um e-mail para <strong>boovoenterprise@gmail.com</strong> com o assunto "Exclusão de Conta" contendo o e-mail cadastrado no app.</p>
<p>Seus dados serão removidos dos nossos servidores em até 30 dias.</p>
